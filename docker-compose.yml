version: "3.9"
services:
  extrator-pdf:
    build: .
    restart: always
    ports:
      - "${APP_PORT:-80}:5000"
    volumes:
      # ==== WINDOWS (servidor da empresa) ====
      # RECOMENDADO: monte só as pastas de dados que o sistema realmente
      # precisa usar, não o disco inteiro. Exemplo (descomente e ajuste):
      #   - "C:/dados/PDFs:/mnt/c/dados/PDFs"
      #   - "C:/dados/Extraidos:/mnt/c/dados/Extraidos"
      #
      # Por padrão (mais simples de configurar, porém mais permissivo — o
      # app consegue ENXERGAR o disco todo, mesmo limitando o que ele deixa
      # o usuário DIGITAR via DATA_ROOTS abaixo):
      - "C:/:/mnt/c"
      - "D:/:/mnt/d"
      # Se houver outros discos ou letras de rede mapeadas, adicione aqui:
      # - "E:/:/mnt/e"
      # - "Z:/:/mnt/z"

      # ==== MAC / LINUX (teste local) ====
      # Comente as 2 linhas do Windows acima e descomente estas, apontando
      # pra uma pasta real no seu computador (ex: onde voce baixou a amostra
      # de PDFs pra testar):
      # - "${ENTRADA_HOST:-./dados/entrada}:/dados/entrada"
      # - "${SAIDA_HOST:-./dados/saida}:/dados/saida"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-troque-esta-chave-em-producao}
      # Lista (separada por ;) das pastas que o formulário tem permissão de
      # ler/gravar, MESMO que o container consiga ver mais disco do que isso.
      # Use caminhos Windows (serão traduzidos automaticamente). Ajuste para
      # as pastas reais da empresa — isso evita que um usuário digite um
      # caminho fora do escopo combinado (ex: C:\Windows) por engano ou
      # má-fé. Exemplo mais restrito:
      #   DATA_ROOTS=C:\dados\PDFs;C:\dados\Extraidos
      #
      # No Mac/Linux (teste local), use o caminho DENTRO do container, que
      # bate com o volume montado acima: DATA_ROOTS=/dados
      - DATA_ROOTS=${DATA_ROOTS:-C:\;D:\}
      # Limite de paginas OCR-adas ao mesmo tempo (buscas + sincronizacao).
      # Baixe esse numero se o servidor estiver travando/lento; suba se
      # tiver CPU sobrando e quiser mais velocidade. Ver .env.example.
      - OCR_CONCORRENTE=${OCR_CONCORRENTE:-2}
      - PASTA_ENTRADA=${PASTA_ENTRADA:-${ENTRADA_PDF:-/dados/entrada}}
      - PASTA_SAIDA=${PASTA_SAIDA:-${SAIDA_PDF:-/dados/saida}}

