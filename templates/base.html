<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>Extrator de PDFs — {% block titulo %}{% endblock %}</title>
  <style>
    :root {
      --bg: #090d16;
      --painel: #12192c;
      --painel-2: #18223c;
      --borda: #232d48;
      --borda-hover: #3b4870;
      --texto: #f1f5f9;
      --texto-fraco: #94a3b8;
      --roxo: #7c3aed;
      --roxo-2: #6366f1;
      --indigo: #4f46e5;
      --amarelo: #f59e0b;
      --azul: #38bdf8;
      --verde: #10b981;
      --verde-hover: #059669;
      --sombra: 0 10px 30px -5px rgba(0, 0, 0, 0.5);
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(1400px 700px at 20% -10%, #172346 0%, var(--bg) 65%);
      color: var(--texto);
      margin: 0;
      padding: 40px 24px 80px;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 1040px; margin: 0 auto; }

    /* Cabeçalho */
    .cabecalho { display: flex; align-items: flex-start; gap: 20px; margin-bottom: 32px; }
    .logo {
      width: 58px; height: 58px; border-radius: 18px; flex-shrink: 0;
      background: linear-gradient(135deg, var(--roxo), var(--indigo));
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; box-shadow: 0 8px 24px rgba(99,102,241,.4);
      border: 1px solid rgba(255,255,255,0.15);
    }
    .titulo-area { flex: 1; }
    h1 { font-size: 28px; margin: 0 0 6px; font-weight: 800; letter-spacing: -0.02em; }
    h1 .destaque {
      background: linear-gradient(90deg, var(--roxo-2), var(--azul));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .subtitulo { color: var(--texto-fraco); font-size: 14.5px; max-width: 580px; line-height: 1.55; }
    .selo {
      align-self: flex-start; background: rgba(24, 34, 60, 0.8); border: 1px solid var(--borda);
      color: var(--texto-fraco); font-size: 12px; font-weight: 600; letter-spacing: .04em;
      padding: 7px 16px; border-radius: 999px; white-space: nowrap; backdrop-filter: blur(8px);
    }

    /* Grade & Paineis */
    .grade { display: grid; grid-template-columns: 1.1fr 1fr; gap: 24px; align-items: start; }
    @media (max-width: 840px) { .grade { grid-template-columns: 1fr; } }

    .painel {
      background: linear-gradient(180deg, rgba(18, 25, 44, 0.95) 0%, rgba(12, 17, 30, 0.95) 100%);
      border: 1px solid var(--borda); border-radius: 20px; padding: 28px;
      box-shadow: var(--sombra); backdrop-filter: blur(12px);
    }

    .painel-titulo { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; }
    .painel-icone {
      width: 44px; height: 44px; border-radius: 14px; flex-shrink: 0;
      background: linear-gradient(135deg, var(--roxo), var(--indigo));
      display: flex; align-items: center; justify-content: center; font-size: 20px;
      box-shadow: 0 4px 14px rgba(99,102,241,.3);
    }
    .painel-titulo h2 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
    .painel-titulo p { margin: 3px 0 0; font-size: 13px; color: var(--texto-fraco); }

    /* Formulários & Campos */
    label { display: block; font-size: 13px; font-weight: 600; color: #cbd5e1; margin: 18px 0 8px; }
    label:first-of-type { margin-top: 0; }
    .campo { position: relative; }
    .campo .icone-campo {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      font-size: 16px; opacity: .8; pointer-events: none;
    }
    input[type=text], input[type=number], select {
      width: 100%; padding: 12px 14px 12px 38px; background: #080d19;
      border: 1px solid var(--borda); border-radius: 12px; color: var(--texto);
      font-size: 14px; font-family: inherit; outline: none; transition: all .2s ease;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
    }
    input[type=number] { padding-left: 14px; }
    input[type=text]:focus, input[type=number]:focus, select:focus {
      border-color: var(--roxo-2);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25), inset 0 2px 4px rgba(0,0,0,0.3);
    }
    input[type=text]::placeholder { color: #475569; }

    /* Botões */
    button, .botao {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; margin-top: 22px; padding: 13px 20px; border: none; border-radius: 12px;
      background: linear-gradient(135deg, var(--roxo) 0%, var(--indigo) 100%);
      color: white; font-size: 14.5px; font-weight: 700; font-family: inherit; cursor: pointer;
      box-shadow: 0 8px 20px rgba(99,102,241,.35); text-decoration: none;
      transition: all .2s ease;
    }
    button:hover:not(:disabled), .botao:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 26px rgba(99,102,241,.45);
      filter: brightness(1.08);
    }
    button:active:not(:disabled), .botao:active {
      transform: translateY(0);
      box-shadow: 0 4px 12px rgba(99,102,241,.3);
    }
    button:disabled { opacity: .6; cursor: not-allowed; transform: none !important; }

    button.secundario, .botao.secundario {
      background: var(--painel-2); box-shadow: none; border: 1px solid var(--borda);
      color: var(--texto);
    }
    button.secundario:hover:not(:disabled), .botao.secundario:hover {
      background: #202b4c; border-color: var(--borda-hover); box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }

    button.sucesso, .botao.sucesso {
      background: linear-gradient(135deg, #059669 0%, var(--verde) 100%);
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.35);
    }
    button.sucesso:hover:not(:disabled), .botao.sucesso:hover {
      box-shadow: 0 12px 26px rgba(16, 185, 129, 0.45);
    }

    a.botao-voltar {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--texto-fraco); font-size: 13.5px; font-weight: 600; text-decoration: none;
      padding: 8px 14px; border-radius: 10px; background: rgba(255,255,255,0.04);
      border: 1px solid var(--borda); transition: all 0.2s; margin-bottom: 20px;
    }
    a.botao-voltar:hover { color: var(--texto); background: rgba(255,255,255,0.08); border-color: var(--borda-hover); }

    /* Passos e Caixas de Info */
    .passos { display: flex; flex-direction: column; gap: 20px; }
    .passo { display: flex; gap: 14px; }
    .passo .n {
      width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
      background: var(--painel-2); border: 1px solid var(--borda);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 800; color: var(--roxo-2);
    }
    .passo h3 { margin: 0 0 3px; font-size: 14.5px; font-weight: 700; }
    .passo p { margin: 0; font-size: 12.5px; color: var(--texto-fraco); line-height: 1.5; }

    .caixa-info {
      margin-top: 20px; border-radius: 14px; padding: 16px 18px; font-size: 13px;
      line-height: 1.55; border: 1px solid var(--borda);
    }
    .caixa-info.ambar { background: rgba(245,158,11,.08); border-color: rgba(245,158,11,.3); }
    .caixa-info.azul { background: rgba(56,189,248,.08); border-color: rgba(56,189,248,.3); }
    .caixa-info strong { display: block; margin-bottom: 4px; font-size: 13.5px; }
    .caixa-info.ambar strong { color: var(--amarelo); }
    .caixa-info.azul strong { color: var(--azul); }
    .caixa-info span { color: var(--texto-fraco); }

    /* Cartão e Alertas */
    .cartao {
      background: linear-gradient(180deg, rgba(18, 25, 44, 0.95) 0%, rgba(12, 17, 30, 0.95) 100%);
      border: 1px solid var(--borda); border-radius: 16px; padding: 24px; margin-bottom: 18px;
      box-shadow: var(--sombra); backdrop-filter: blur(12px);
    }
    .flash {
      background: rgba(245,158,11,.1); border: 1px solid rgba(245,158,11,.35); color: #fcd34d;
      padding: 14px 18px; border-radius: 12px; margin-bottom: 20px; font-size: 13.5px;
      display: flex; align-items: center; gap: 10px;
    }
    .trecho {
      color: #cbd5e1; font-size: 13px; font-style: italic; background: #080d19;
      padding: 12px 16px; border-radius: 10px; border-left: 3px solid var(--roxo-2);
      margin: 12px 0 16px; line-height: 1.5;
    }

    /* Colunas de Ajuste */
    .colunas { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    @media (max-width: 600px) { .colunas { grid-template-columns: 1fr; } }
    .coluna { flex: 1; }

    /* Barra de Progresso & Overlay */
    .caixa-progresso {
      background: var(--painel); border: 1px solid var(--borda); border-radius: 20px;
      padding: 36px 40px; width: 480px; max-width: 90vw; text-align: center;
      box-shadow: 0 25px 70px rgba(0,0,0,.6);
    }
    .spinner {
      width: 44px; height: 44px; margin: 0 auto 20px;
      border: 4px solid var(--borda); border-top-color: var(--roxo-2);
      border-radius: 50%; animation: girar 0.8s linear infinite;
    }
    @keyframes girar { to { transform: rotate(360deg); } }
    .caixa-progresso h3 { margin: 0 0 16px; font-size: 16px; font-weight: 700; }
    .barra-fundo {
      width: 100%; height: 10px; background: #080d19; border: 1px solid var(--borda);
      border-radius: 999px; overflow: hidden; margin-bottom: 14px;
    }
    .barra-preenchida {
      height: 100%; width: 0%; background: linear-gradient(90deg, var(--roxo), var(--azul));
      transition: width .3s ease; border-radius: 999px;
    }
    #progresso-detalhe { margin: 0; font-size: 13px; color: var(--texto-fraco); word-break: break-word; }
    .aviso-nao-feche { margin: 16px 0 0; font-size: 12px; color: var(--amarelo); line-height: 1.5; }

    code {
      background: #080d19; border: 1px solid var(--borda); padding: 4px 10px;
      border-radius: 8px; color: var(--azul); font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px; word-break: break-all;
    }

    /* Badges */
    .badge {
      display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
      border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--painel-2);
      border: 1px solid var(--borda); color: var(--texto-fraco);
    }
    .badge-roxo { background: rgba(124,58,237,0.15); border-color: rgba(124,58,237,0.35); color: #c4b5fd; }
    .badge-verde { background: rgba(16,185,129,0.15); border-color: rgba(16,185,129,0.35); color: #6ee7b7; }
  </style>
</head>
<body>
  <div class="container">
    {% with mensagens = get_flashed_messages() %}
      {% if mensagens %}
        {% for m in mensagens %}<div class="flash">⚠️ {{ m }}</div>{% endfor %}
      {% endif %}
    {% endwith %}
    {% block conteudo %}{% endblock %}
  </div>
</body>
</html>
