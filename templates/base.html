<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>Extrator de PDFs — {% block titulo %}{% endblock %}</title>
  <style>
    :root {
      --bg: #0b1120;
      --painel: #131b2e;
      --painel-2: #1a2440;
      --borda: #262f47;
      --texto: #e2e8f0;
      --texto-fraco: #94a3b8;
      --roxo: #7c3aed;
      --roxo-2: #6366f1;
      --indigo: #4f46e5;
      --amarelo: #f59e0b;
      --azul: #38bdf8;
      --verde: #22c55e;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", Inter, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 20% -10%, #1e2a52 0%, var(--bg) 55%);
      color: var(--texto);
      margin: 0;
      padding: 40px 24px 80px;
    }
    .container { max-width: 1000px; margin: 0 auto; }

    .cabecalho { display: flex; align-items: flex-start; gap: 18px; margin-bottom: 32px; }
    .logo {
      width: 56px; height: 56px; border-radius: 16px; flex-shrink: 0;
      background: linear-gradient(135deg, var(--roxo), var(--indigo));
      display: flex; align-items: center; justify-content: center;
      font-size: 26px; box-shadow: 0 8px 24px rgba(99,102,241,.35);
    }
    .titulo-area { flex: 1; }
    h1 { font-size: 28px; margin: 0 0 6px; font-weight: 800; }
    h1 .destaque {
      background: linear-gradient(90deg, var(--roxo-2), var(--azul));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .subtitulo { color: var(--texto-fraco); font-size: 14.5px; max-width: 560px; line-height: 1.5; }
    .selo {
      align-self: flex-start; background: var(--painel-2); border: 1px solid var(--borda);
      color: var(--texto-fraco); font-size: 12px; font-weight: 600; letter-spacing: .04em;
      padding: 7px 14px; border-radius: 999px; white-space: nowrap;
    }

    .grade { display: grid; grid-template-columns: 1.1fr 1fr; gap: 22px; align-items: start; }
    @media (max-width: 820px) { .grade { grid-template-columns: 1fr; } }

    .painel {
      background: linear-gradient(180deg, var(--painel) 0%, #0f1830 100%);
      border: 1px solid var(--borda); border-radius: 18px; padding: 26px;
    }

    .painel-titulo { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
    .painel-icone {
      width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0;
      background: linear-gradient(135deg, var(--roxo), var(--indigo));
      display: flex; align-items: center; justify-content: center; font-size: 18px;
    }
    .painel-titulo h2 { margin: 0; font-size: 17px; font-weight: 700; }
    .painel-titulo p { margin: 2px 0 0; font-size: 12.5px; color: var(--texto-fraco); }

    label { display: block; font-size: 13px; font-weight: 600; color: #cbd5e1; margin: 18px 0 8px; }
    label:first-of-type { margin-top: 0; }
    .campo { position: relative; }
    .campo .icone-campo {
      position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
      font-size: 15px; opacity: .8;
    }
    input[type=text] {
      width: 100%; padding: 12px 14px 12px 38px; background: #0c1426;
      border: 1px solid var(--borda); border-radius: 10px; color: var(--texto);
      font-size: 14px; outline: none; transition: border-color .15s;
    }
    input[type=text]:focus { border-color: var(--roxo-2); }
    input[type=text]::placeholder { color: #64748b; }

    button {
      width: 100%; margin-top: 22px; padding: 13px; border: none; border-radius: 10px;
      background: linear-gradient(90deg, var(--roxo), var(--indigo));
      color: white; font-size: 15px; font-weight: 700; cursor: pointer;
      box-shadow: 0 10px 24px rgba(99,102,241,.35);
    }
    button:disabled { opacity: .65; cursor: default; }
    button.secundario {
      background: var(--painel-2); box-shadow: none; border: 1px solid var(--borda);
    }
    a.botao {
      display: inline-block; text-decoration: none; margin-top: 18px; padding: 11px 20px;
      border-radius: 10px; background: linear-gradient(90deg, var(--roxo), var(--indigo));
      color: white; font-weight: 700; font-size: 14px;
    }
    a.botao.secundario { background: var(--painel-2); border: 1px solid var(--borda); }

    #aviso-processando {
      display: none; margin-top: 14px; font-size: 13px; color: var(--texto-fraco);
      background: #1a2440; border: 1px solid var(--borda); border-radius: 10px; padding: 10px 12px;
    }

    .passos { display: flex; flex-direction: column; gap: 20px; }
    .passo { display: flex; gap: 14px; }
    .passo .n {
      width: 32px; height: 32px; border-radius: 10px; flex-shrink: 0;
      background: var(--painel-2); border: 1px solid var(--borda);
      display: flex; align-items: center; justify-content: center;
      font-size: 12.5px; font-weight: 800; color: var(--roxo-2);
    }
    .passo h3 { margin: 0 0 3px; font-size: 14.5px; font-weight: 700; }
    .passo p { margin: 0; font-size: 12.5px; color: var(--texto-fraco); line-height: 1.5; }

    .caixa-info {
      margin-top: 20px; border-radius: 12px; padding: 14px 16px; font-size: 12.5px;
      line-height: 1.5; border: 1px solid var(--borda);
    }
    .caixa-info.ambar { background: rgba(245,158,11,.08); border-color: rgba(245,158,11,.35); }
    .caixa-info.azul { background: rgba(56,189,248,.08); border-color: rgba(56,189,248,.35); }
    .caixa-info strong { display: block; margin-bottom: 4px; font-size: 13px; }
    .caixa-info.ambar strong { color: var(--amarelo); }
    .caixa-info.azul strong { color: var(--azul); }
    .caixa-info span { color: var(--texto-fraco); }

    .cartao { background: var(--painel); border: 1px solid var(--borda); border-radius: 14px; padding: 20px; margin-bottom: 16px; }
    .flash {
      background: rgba(245,158,11,.1); border: 1px solid rgba(245,158,11,.4); color: #fcd34d;
      padding: 12px 16px; border-radius: 10px; margin-bottom: 18px; font-size: 13.5px;
    }
    .trecho { color: var(--texto-fraco); font-size: 12.5px; font-style: italic; }
    .paginas img { max-width: 100%; border: 1px solid var(--borda); border-radius: 8px; }
    .colunas { display: flex; gap: 20px; flex-wrap: wrap; }
    .coluna { flex: 1; min-width: 220px; }
    .controles { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    .controles input { width: 90px; text-align: center; }
    a { color: var(--azul); }
    code { background: #0c1426; border: 1px solid var(--borda); padding: 3px 8px; border-radius: 6px; color: #e2e8f0; }

    /* Overlay de bloqueio durante a busca */
    #overlay-processando {
      display: none; position: fixed; inset: 0; z-index: 9999;
      background: rgba(5, 8, 20, .82); backdrop-filter: blur(2px);
      align-items: center; justify-content: center;
    }
    .caixa-progresso {
      background: var(--painel); border: 1px solid var(--borda); border-radius: 16px;
      padding: 32px 36px; width: 380px; max-width: 90vw; text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
    }
    .spinner {
      width: 40px; height: 40px; margin: 0 auto 18px;
      border: 4px solid var(--borda); border-top-color: var(--roxo-2);
      border-radius: 50%; animation: girar 0.8s linear infinite;
    }
    @keyframes girar { to { transform: rotate(360deg); } }
    .caixa-progresso h3 { margin: 0 0 16px; font-size: 15px; }
    .barra-fundo {
      width: 100%; height: 10px; background: #0c1426; border: 1px solid var(--borda);
      border-radius: 999px; overflow: hidden; margin-bottom: 12px;
    }
    .barra-preenchida {
      height: 100%; width: 0%; background: linear-gradient(90deg, var(--roxo), var(--azul));
      transition: width .3s ease;
    }
    #progresso-detalhe { margin: 0; font-size: 12.5px; color: var(--texto-fraco); word-break: break-word; }
    .aviso-nao-feche { margin: 14px 0 0; font-size: 12px; color: var(--amarelo); }
  </style>
</head>
<body>
  <div class="container">
    {% with mensagens = get_flashed_messages() %}
      {% if mensagens %}
        {% for m in mensagens %}<div class="flash">⚠️ {{ m }}</div>{% endfor %}
      {% endif %}
    {% endwith %}
    {% block conteudo %}{% endblock %}
  </div>
</body>
</html>
