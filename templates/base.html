<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>Extrator de PDFs — {% block titulo %}{% endblock %}</title>
  <style>
    body { font-family: -apple-system, Segoe UI, Arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; color: #1f2933; background: #f7f8fa; }
    h1 { font-size: 22px; }
    h2 { font-size: 17px; color: #334155; }
    label { display:block; margin-top: 16px; font-weight: 600; font-size: 14px; }
    input[type=text] { width: 100%; padding: 9px; margin-top: 6px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; box-sizing: border-box; }
    button, .botao { background: #2563eb; color: white; border: none; padding: 10px 18px; border-radius: 6px; font-size: 14px; cursor: pointer; margin-top: 18px; text-decoration: none; display: inline-block; }
    button.secundario, .botao.secundario { background: #64748b; }
    .cartao { background: white; border: 1px solid #e2e8f0; border-radius: 10px; padding: 20px; margin-bottom: 16px; }
    .flash { background: #fef3c7; border: 1px solid #f59e0b; padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; font-size: 14px; }
    .trecho { color: #64748b; font-size: 13px; font-style: italic; }
    .paginas img { max-width: 100%; border: 1px solid #cbd5e1; border-radius: 4px; }
    .colunas { display: flex; gap: 20px; }
    .coluna { flex: 1; }
    .controles { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    .controles input { width: 70px; text-align: center; }
    a { color: #2563eb; }
    code { background: #eef2f7; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  {% with mensagens = get_flashed_messages() %}
    {% if mensagens %}
      {% for m in mensagens %}<div class="flash">{{ m }}</div>{% endfor %}
    {% endif %}
  {% endwith %}
  {% block conteudo %}{% endblock %}
</body>
</html>
